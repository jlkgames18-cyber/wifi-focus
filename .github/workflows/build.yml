name: Build APK from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # فك الضغط والبحث الشامل عن الملفات ونقلها للمسار الرئيسي
      - name: Unzip and Fix Paths
        run: |
          unzip wifi-focus.zip
          # البحث عن مكان وجود ملف settings.gradle.kts أو build.gradle.kts ونقل محتوياته للمسار الرئيسي
          BUILD_DIR=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -n "$BUILD_DIR" ] && [ "$BUILD_DIR" != "." ]; then
            cp -r $BUILD_DIR/* . || true
            cp -r $BUILD_DIR/.* . || true
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # توليد ملف gradlew وتجهيز البيئة تلقائياً في حال فقدانه
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "**/build/outputs/apk/debug/*.apk"
