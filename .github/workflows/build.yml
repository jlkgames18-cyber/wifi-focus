name: Build APK from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # فك الضغط الذكي ونقل الملفات للمسار الرئيسي مباشرة
      - name: Unzip project
        run: |
          unzip wifi-focus.zip
          if [ -d "wifi-focus" ]; then
            cp -r wifi-focus/* . || true
            cp -r wifi-focus/.* . || true
          fi
          # بحث احتياطي إذا كان المجلد الداخلي باسم مختلف
          if [ ! -f "gradlew" ]; then
            find . -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1 | xargs -I {} cp -r {}/* . || true
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Change permissions
        run: |
          chmod +x gradlew || chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "**/build/outputs/apk/debug/*.apk"
