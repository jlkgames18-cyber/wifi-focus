name: Build APK from ZIP

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. فك ضغط الملف ونقل محتوياته للمسار الرئيسي
      - name: Unzip project
        run: |
          unzip wifi-focus.zip
          if [ -d "wifi-focus" ]; then
            cp -r wifi-focus/* . || true
            cp -r wifi-focus/.* . || true
          fi

      # 2. إجبار الخادم على استخدام جافا 17 (المتوافقة مع أندرويد ستوديو ومشروعك)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد واستخدام نسخة Gradle 8.2 المتوافقة مع كود مشروعك تماماً
      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # 4. إعطاء صلاحيات التشغيل
      - name: Change permissions
        run: chmod +x gradlew || true

      # 5. بناء التطبيق باستخدام إصدار البيئة المستقرة
      - name: Build APK
        run: gradle assembleDebug

      # 6. رفع الـ APK النهائي الجاهز
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "**/build/outputs/apk/debug/*.apk"
